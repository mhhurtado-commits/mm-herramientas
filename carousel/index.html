<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Studio - Media Mendoza</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="carousel-app">
  <div class="carousel-shell mm-animate">
    <div class="carousel-hero">
      <div class="carousel-kicker">Media Mendoza Suite</div>
      <h1 class="carousel-title">Instagram Studio</h1>
      <p class="carousel-subtitle">Converti una nota en piezas editoriales para Instagram, con salida de carrusel y vista previa para reel desde un mismo flujo.</p>
    </div>

    <div id="inputArea" class="carousel-toolbar">
      <div class="mm-field carousel-url-field">
        <label class="mm-label" for="urlInput">URL de la nota</label>
        <input type="url" id="urlInput" class="mm-input carousel-url-input" placeholder="https://mediamendoza.com/..." />
      </div>
      <div class="carousel-actions">
        <button id="loadBtn" class="mm-btn mm-btn-primary">Cargar noticia</button>
        <button id="clearBtn" class="mm-btn">Limpiar</button>
      </div>
    </div>

    <div id="previewPanel" class="carousel-panel">
      <div class="carousel-panel-header">
        <div>
          <div class="carousel-section-label">Instagram</div>
          <strong class="carousel-panel-title">Editor de publicaciones</strong>
        </div>
        <div id="previewContent" class="carousel-status"></div>
      </div>
      <div class="carousel-tabs" role="tablist" aria-label="Salidas editoriales">
        <button id="carouselTabBtn" class="carousel-tab is-active" type="button" data-tab="carousel" role="tab" aria-selected="true">Carrusel</button>
        <button id="reelTabBtn" class="carousel-tab" type="button" data-tab="reel" role="tab" aria-selected="false">Reel</button>
      </div>

      <div id="carouselTabPanel" class="carousel-tab-panel" data-tab-panel="carousel" role="tabpanel">
        <div id="carousel-preview"></div>
        <div id="captionPanelHost" class="carousel-tab-stack"></div>
      </div>

      <div id="reelTabPanel" class="carousel-tab-panel" data-tab-panel="reel" role="tabpanel" hidden>
        <div id="reelPreviewPanelHost" class="carousel-tab-stack"></div>
        <div id="reelCaptionPanelHost" class="carousel-tab-stack"></div>
        <div id="reelPlanPanelHost" class="carousel-tab-stack"></div>
        <div id="reelStoryboardPanelHost" class="carousel-tab-stack"></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
