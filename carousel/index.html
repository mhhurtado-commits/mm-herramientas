<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel — Media Mendoza</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <h2>Carrusel para Instagram</h2>
  <div id="inputArea" class="carousel-toolbar">
    <input type="url" id="urlInput" class="carousel-url-input" placeholder="https://mediamendoza.com/..." />
    <div class="carousel-actions">
      <button id="loadBtn">Cargar noticia</button>
      <button id="demoBtn">Cargar Demo</button>
    </div>
  </div>
  <div id="previewPanel" class="carousel-panel">
    <div class="carousel-panel-header">
      <strong>Editor</strong>
      <div id="previewContent" class="carousel-status"></div>
    </div>
    <div id="carousel-preview"></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
