      <rect x="204" width="176" height="330" rx="12" fill="#17241e"/><text x="220" y="38" font-family="Arial" font-size="10" font-weight="800" fill="#a6ce39">02 · EN CONTEXTO</text><text x="220" y="92" font-family="Arial" font-size="19" font-weight="800" fill="#fff">Una pausa visual</text><text x="220" y="115" font-family="Arial" font-size="19" font-weight="800" fill="#fff">para destacar</text><rect x="220" y="190" width="140" height="69" rx="8" fill="#263c30"/><text x="236" y="217" font-family="Arial" font-size="11" font-weight="700" fill="#fff">Contraste entre</text><text x="236" y="235" font-family="Arial" font-size="11" font-weight="700" fill="#fff">diapositivas.</text>
