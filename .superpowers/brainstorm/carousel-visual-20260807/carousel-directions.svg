  <text x="70" y="116" font-family="Arial,sans-serif" font-size="37" font-weight="800" fill="#15211b">Portada + diapositiva interna</text>
  <text x="70" y="149" font-family="Arial,sans-serif" font-size="17" fill="#637067">Tres caminos para llevar la familia de placas-v2 al carrusel.</text>
