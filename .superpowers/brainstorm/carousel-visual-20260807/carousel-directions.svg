      <text x="220" y="78" font-family="Arial" font-size="19" font-weight="800" fill="#15211b">El dato principal</text><text x="220" y="101" font-family="Arial" font-size="19" font-weight="800" fill="#15211b">ocupa el centro</text>
      <rect x="220" y="190" width="140" height="69" rx="8" fill="#eef5e9"/><rect x="220" y="190" width="6" height="69" rx="3" fill="#a6ce39"/><text x="237" y="215" font-family="Arial" font-size="11" font-weight="700" fill="#15211b">Contexto breve y</text><text x="237" y="233" font-family="Arial" font-size="11" font-weight="700" fill="#15211b">legible, con aire.</text>
