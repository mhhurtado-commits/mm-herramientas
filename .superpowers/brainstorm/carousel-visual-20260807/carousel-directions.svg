      <rect x="204" width="176" height="330" rx="12" fill="#f3eadc"/><rect x="220" y="18" width="54" height="72" rx="8" fill="#173126"/><text x="229" y="70" font-family="Arial" font-size="20" font-weight="900" fill="#fff">$4,3M</text><text x="286" y="34" font-family="Arial" font-size="10" font-weight="800" fill="#719421">DATO CLAVE</text><text x="286" y="72" font-family="Arial" font-size="16" font-weight="800" fill="#15211b">Una cifra</text><text x="286" y="91" font-family="Arial" font-size="16" font-weight="800" fill="#15211b">ordena</text><rect x="220" y="150" width="140" height="69" rx="8" fill="#fff"/><text x="234" y="178" font-family="Arial" font-size="11" font-weight="700" fill="#15211b">Ideal para notas</text><text x="234" y="196" font-family="Arial" font-size="11" font-weight="700" fill="#15211b">complejas.</text>
